<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinnovate, Inc. — Standby</title>
  <meta name="description" content="Infinnovate, Inc. is preparing an updated website experience. Please check back soon." />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root {
      --navy: #0A1628;
      --gold: #C9982A;
      --cream: #F8F6F1;
      --slate: #8FA0B8;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      background: radial-gradient(circle at top right, rgba(201,152,42,.12), transparent 28%), linear-gradient(160deg, #09111f 0%, #0A1628 55%, #132743 100%);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      width: 100%;
      max-width: 760px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      padding: 48px 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 30px 80px rgba(0,0,0,.28);
      text-align: center;
    }
    .eyebrow {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(201,152,42,.14);
      color: #F7D68A;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 22px 0 14px;
      font-size: clamp(38px, 7vw, 64px);
      line-height: .96;
      letter-spacing: -.03em;
    }
    p.lead {
      margin: 0 auto;
      max-width: 620px;
      font-size: clamp(18px, 2.2vw, 22px);
      line-height: 1.6;
      color: #E6ECF5;
    }
    .sub {
      margin: 26px auto 0;
      max-width: 560px;
      font-size: 15px;
      line-height: 1.7;
      color: var(--slate);
    }
    .brand {
      margin-top: 34px;
      color: var(--cream);
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: 13px;
    }
    @media (max-width: 640px) {
      .card { padding: 36px 24px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Standby Page</div>
    <h1>We’re updating the site.</h1>
    <p class="lead">Infinnovate, Inc. is preparing an updated website experience. Please check back soon.</p>
    <p class="sub">We’re currently reviewing and finalizing the next version before relaunch.</p>
    <div class="brand">Infinnovate, Inc.</div>
  </main>
</body>
</html>
